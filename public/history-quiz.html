<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История 5 класс — тест</title><style>body{font-family:Arial,sans-serif;background:#f3f7fb;color:#223;margin:0}.w{max-width:760px;margin:auto;padding:24px}.c{background:#fff;border:1px solid #dbe5ee;border-radius:18px;padding:22px;box-shadow:0 8px 24px #ccd7e244}h1{color:#244e73}.opt{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border:1px solid #cfdce7;border-radius:12px;background:#fff;font-size:16px}.ok{background:#eaf7ef;border-color:#6fb486}.bad{background:#fff0ee;border-color:#d6786f}.btn{padding:12px 16px;border:0;border-radius:12px;background:#2f6fa3;color:#fff;font-weight:700}.muted{color:#68798a}.hide{display:none}.bar{height:8px;background:#e6edf3;border-radius:9px;overflow:hidden}.fill{height:100%;background:#2f6fa3}</style><div class="w"><h1>История · 5 класс</h1><p class="muted">Самопроверка: «Первобытные охотники и собиратели»</p><div id="quiz" class="c"><div id="p"></div><div class="bar"><div id="f" class="fill"></div></div><h2 id="q"></h2><div id="o"></div><p id="fb" class="hide"></p><button id="n" class="btn hide">Следующий вопрос</button></div><div id="res" class="c hide"><h2 id="score"></h2><p id="msg"></p><button class="btn" onclick="restart()">Пройти ещё раз</button></div></div><script>const Q=[['Какие занятия были основой жизни первобытных охотников и собирателей?',['Охота и собирательство','Земледелие и торговля','Ремесло и мореплавание','Скотоводство и земледелие'],0,'Охота и собирательство давали основные продукты питания и материалы.'],['Почему охота на крупных животных обычно была коллективной?',['Так было легче добыть крупного зверя и защититься','Охотиться одному запрещали старейшины','У людей не было собственного оружия','Люди охотились только во время праздников'],0,'Совместные действия делали охоту успешнее и безопаснее.'],['Каково главное значение огня для древнего человека?',['Тепло, защита, свет и приготовление пищи','Только освещение пещер','Только изготовление орудий','Переход к земледелию'],0,'Огонь согревал, защищал, освещал и помогал готовить пищу.'],['Что такое присваивающее хозяйство?',['Получение готовых ресурсов природы','Выращивание растений и разведение животных','Торговля между племенами','Хранение общей добычи'],0,'Это использование готовых ресурсов природы: охота, собирательство, рыболовство.'],['Что такое родовая община?',['Коллектив кровных родственников, живших и трудившихся вместе','Случайная группа охотников','Жители древнего города','Армия нескольких племён'],0,'Родовую общину объединяли родство, совместная жизнь и общее хозяйство.'],['Как связаны род и племя?',['Несколько родов могли объединяться в племя','Несколько племён составляли один род','Это одно и то же','Племя состояло из одной семьи'],0,'Племя было более крупным объединением и включало несколько родов.'],['Почему родовая община повышала шансы на выживание?',['Можно было вместе охотиться, защищаться и строить жилища','Люди переставали добывать пищу','Орудия труда больше не требовались','Опасности полностью исчезали'],0,'Совместный труд и взаимопомощь облегчали выживание.'],['Как природные условия влияли на жизнь первобытных людей?',['На занятия, жилища, одежду и добывание пищи','Практически не влияли','Только на цвет орудий','Только на язык'],0,'Климат и среда заставляли людей приспосабливать образ жизни.'],['Какой взгляд на человеческие расы соответствует современной науке?',['Все люди относятся к одному виду Homo sapiens','Разные расы — отдельные виды','Внешние признаки не связаны со средой','Расы возникли независимо друг от друга'],0,'Современная наука подчёркивает биологическое единство человечества.'],['Почему современный взгляд на расы изменился?',['Исследования показали единство человечества и условность жёстких границ','Внешних различий вообще нет','Люди перестали зависеть от наследственности','Все признаки возникли недавно'],0,'Антропология и генетика показали тесное родство человеческих групп.']];let i=0,s=0;function r(){p.textContent=`Вопрос ${i+1} из ${Q.length}`;f.style.width=((i+1)/Q.length*100)+'%';q.textContent=Q[i][0];o.innerHTML='';fb.className='hide';n.className='btn hide';Q[i][1].forEach((x,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>a(j,b);o.appendChild(b)})}function a(j,b){[...o.children].forEach(x=>x.disabled=true);[...o.children][Q[i][2]].classList.add('ok');if(j===Q[i][2]){s++;fb.textContent='Верно! '+Q[i][3];fb.className='ok'}else{b.classList.add('bad');fb.textContent='Пока нет. '+Q[i][3];fb.className='bad'}n.className='btn'}n.onclick=()=>{if(++i<Q.length)r();else end()};function end(){quiz.className='c hide';res.className='c';score.textContent=`Результат: ${s}/${Q.length}`;msg.textContent=s===10?'Отлично! Тема усвоена очень уверенно.':s>=8?'Очень хороший результат. Повтори только ошибки.':s>=6?'Основа понятна. Повтори сложные места.':'Стоит ещё раз посмотреть материал и пройти тест повторно.'}function restart(){i=0;s=0;res.className='c hide';quiz.className='c';r()}r();</script></html>
