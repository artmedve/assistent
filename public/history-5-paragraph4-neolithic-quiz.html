<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История 5 класс — §4. Возникновение земледелия, скотоводства и ремесла</title><style>
:root{--ink:#17324d;--blue:#2d6fa3;--line:#d8e5ef;--ok:#eaf8ef;--okb:#65ad7c;--bad:#fff0ed;--badb:#d67369;--bg:#f5f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#213547}.wrap{max-width:780px;margin:auto;padding:18px}.tag{display:inline-block;background:#fff3c9;color:#704f00;border-radius:999px;padding:7px 11px;font-weight:700;font-size:13px}.hero h1{font-size:27px;line-height:1.15;color:var(--ink);margin:12px 0 6px}.hero p{color:#617487;margin:0 0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(31,59,87,.07)}.meta{display:flex;justify-content:space-between;color:#6b7f91;font-size:14px}.bar{height:9px;background:#e8eef4;border-radius:20px;overflow:hidden;margin:10px 0 20px}.fill{height:100%;background:var(--blue);width:10%;transition:.25s}.q{font-size:22px;line-height:1.3;color:var(--ink);margin:0 0 18px}.opt{display:block;width:100%;text-align:left;border:1px solid #cfdce7;background:#fff;border-radius:14px;padding:14px 15px;margin:9px 0;font-size:16px;cursor:pointer}.opt.correct{background:var(--ok);border-color:var(--okb)}.opt.wrong{background:var(--bad);border-color:var(--badb)}.opt:disabled{cursor:default;color:#213547}.feedback{margin-top:15px;border-radius:14px;padding:13px 14px}.feedback.ok{background:var(--ok);border:1px solid var(--okb)}.feedback.bad{background:var(--bad);border:1px solid var(--badb)}.hide{display:none}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:750;font-size:15px;cursor:pointer;background:var(--blue);color:#fff;margin-top:16px}.score{font-size:42px;font-weight:800;color:var(--ink)}.mistake{border-top:1px solid var(--line);padding:12px 0}.foot{text-align:center;color:#7c8b98;font-size:12px;margin-top:12px}@media(max-width:600px){.wrap{padding:12px}.card{padding:17px}.q{font-size:19px}.opt{font-size:15px}}
</style></head><body><div class="wrap"><div class="hero"><span class="tag">Бесплатная самопроверка</span><h1>История · 5 класс<br>§4. Возникновение земледелия, скотоводства и ремесла</h1><p>10 вопросов по стр. 29–34. Регистрация не нужна.</p></div><div id="quiz" class="card"><div class="meta"><span id="pt"></span><span id="ls"></span></div><div class="bar"><div id="fill" class="fill"></div></div><h2 id="q" class="q"></h2><div id="opts"></div><div id="fb" class="feedback hide"></div><button id="next" class="btn hide">Следующий вопрос</button></div><div id="result" class="card hide"><h2>Готово!</h2><div id="score" class="score"></div><p id="rt"></p><div id="mistakes"></div><button class="btn" onclick="restart()">Пройти ещё раз</button></div><p class="foot">Тест работает прямо в браузере.</p></div><script>
const Q=[
{q:'Когда примерно начался неолит?',o:['Около 100 тысяч лет назад','Около 10 тысяч лет назад','В 4-м тысячелетии до н. э.','Во 2-м тысячелетии до н. э.'],a:1,e:'Учебник указывает: приблизительно 10 тысяч лет назад начался неолит — новый каменный век.'},
{q:'Что главное отличает производящее хозяйство?',o:['Люди только собирают готовые дары природы','Люди сами производят необходимые продукты','Люди живут только охотой','Люди используют только металлические орудия'],a:1,e:'Главная особенность производящего хозяйства — производство жизненно необходимых продуктов.'},
{q:'Чем земледелие отличалось от собирательства?',o:['Земледельцы сами выращивали растения','Земледельцы только искали дикорастущие растения','Собиратели разводили домашних животных','Различий не было'],a:0,e:'Земледелец сеет и выращивает урожай, а собиратель берёт готовые растения у природы.'},
{q:'Почему земледелие способствовало оседлому образу жизни?',o:['Поле и урожай требовали постоянного ухода','Люди перестали нуждаться в пище','Животные перестали перемещаться','Земледелие запрещало охоту'],a:0,e:'Чтобы обработать землю, дождаться урожая и собрать его, людям было выгодно жить рядом с полями.'},
{q:'Какие ремёсла показаны в параграфе как новые занятия?',o:['Гончарное дело и ткачество','Кораблестроение и книгопечатание','Ювелирное дело и чеканка монет','Строительство храмов и письмо'],a:0,e:'В параграфе показаны изготовление глиняной посуды и работа на ткацком станке.'},
{q:'Что произошло в 4-м тысячелетии до н. э. на Востоке?',o:['Началась обработка железа','Изобрели колесо','Появился лук','Начался палеолит'],a:1,e:'В 4-м тысячелетии до н. э. на Востоке изобрели колесо, появились первые повозки.'},
{q:'Какова правильная последовательность материалов?',o:['Железо → бронза → медь','Камень → медь → бронза → железо','Медь → камень → железо → бронза','Бронза → камень → медь → железо'],a:1,e:'Сначала преобладали каменные орудия, затем распространилась медь, потом бронза и позже железо.'},
{q:'Чем соседская община отличалась от родовой?',o:['В соседской общине жили только кровные родственники','Семьи-соседи вели отдельные хозяйства на своих участках','В соседской общине не было общих работ','Соседская община существовала только у охотников'],a:1,e:'Соседская община состояла из семей-соседей, которые вели отдельные хозяйства на своих участках.'},
{q:'Почему возникло имущественное неравенство?',o:['Все семьи получали одинаковые излишки','Разные семьи накапливали разное богатство через излишки, обмен и добычу','Люди отказались от обмена','Все продукты стали принадлежать только племени'],a:1,e:'У одних семей появлялось больше излишков; богатство накапливалось через обмен и военную добычу.'},
{q:'Как называется переход от присваивающего хозяйства к производящему?',o:['Бронзовый переворот','Неолитическая революция','Промышленная революция','Великое переселение'],a:1,e:'Этот переход называют неолитической революцией, потому что он коренным образом изменил образ жизни людей.'}
];
let i=0,s=0,locked=false,wrong=[];const q=document.getElementById('q'),opts=document.getElementById('opts'),fb=document.getElementById('fb'),next=document.getElementById('next'),fill=document.getElementById('fill'),pt=document.getElementById('pt'),ls=document.getElementById('ls');function render(){locked=false;pt.textContent=`Вопрос ${i+1} из ${Q.length}`;ls.textContent=`${s} правильных`;fill.style.width=`${(i+1)/Q.length*100}%`;q.textContent=Q[i].q;opts.innerHTML='';fb.className='feedback hide';next.className='btn hide';Q[i].o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>ans(j,b);opts.appendChild(b);});}function ans(j,b){if(locked)return;locked=true;[...opts.children].forEach(x=>x.disabled=true);const a=Q[i].a;[...opts.children][a].classList.add('correct');if(j===a){s++;fb.textContent='Верно. '+Q[i].e;fb.className='feedback ok';}else{b.classList.add('wrong');wrong.push({q:Q[i].q,y:Q[i].o[j],c:Q[i].o[a]});fb.textContent='Пока нет. '+Q[i].e;fb.className='feedback bad';}ls.textContent=`${s} правильных`;next.className='btn';next.textContent=i===Q.length-1?'Показать результат':'Следующий вопрос';}next.onclick=()=>{i++;i<Q.length?render():finish();};function finish(){document.getElementById('quiz').classList.add('hide');document.getElementById('result').classList.remove('hide');document.getElementById('score').textContent=`${s} / ${Q.length}`;document.getElementById('rt').textContent=s===10?'Отлично: тема усвоена уверенно.':s>=8?'Очень хорошо. Повтори только ошибки.':s>=6?'Основа понятна, но стоит повторить сложные места.':'Лучше ещё раз пройти материал и повторить тест.';document.getElementById('mistakes').innerHTML=wrong.length?'<h3>Что повторить</h3>'+wrong.map(x=>`<div class="mistake"><b>${x.q}</b><br>Твой ответ: ${x.y}<br>Правильно: ${x.c}</div>`).join(''):'<p><b>Ошибок нет.</b></p>';}function restart(){i=0;s=0;wrong=[];document.getElementById('result').classList.add('hide');document.getElementById('quiz').classList.remove('hide');render();window.scrollTo({top:0,behavior:'smooth'});}render();
</script></body></html>
