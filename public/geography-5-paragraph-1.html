<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>География, 5 класс — § 1</title>
<style>
:root{--b:#2563eb;--bg:#f3f7ff;--text:#172033;--muted:#6b7487;--line:#dfe7f2;--ok:#15803d;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#eaf3ff,#f9fbff 48%,#fff);color:var(--text);min-height:100vh}.wrap{width:min(760px,calc(100% - 24px));margin:auto;padding:28px 0 52px}.brand{font-weight:800;color:#49617e;font-size:14px;margin:0 0 16px}.card{background:#fff;border:1px solid #e2eaf5;border-radius:24px;padding:30px;box-shadow:0 20px 55px rgba(36,70,125,.12)}h1{font-size:clamp(30px,6vw,44px);line-height:1.08;margin:0 0 14px}h2{margin:0}.lead{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 22px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 28px}.chip{background:#eaf2ff;color:#2359a8;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:800}button{font:inherit}.btn{border:0;border-radius:14px;padding:14px 18px;min-height:50px;font-weight:850;cursor:pointer}.primary{background:var(--b);color:white;box-shadow:0 8px 22px rgba(37,99,235,.23)}.secondary{background:#eef3f9;color:#304762}.btn:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none!important}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;font-weight:800;margin-bottom:10px}.progress{height:10px;background:#e8eef7;border-radius:999px;overflow:hidden;margin-bottom:26px}.bar{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);transition:.25s}.question{font-size:clamp(22px,4vw,30px);line-height:1.3;margin-bottom:22px}.answers{display:grid;gap:11px}.answer{width:100%;text-align:left;border:2px solid var(--line);background:white;border-radius:16px;padding:14px 15px;cursor:pointer;display:flex;gap:12px;line-height:1.42;color:var(--text)}.answer:hover{border-color:#9abcf0;background:#fbfdff}.answer.sel{border-color:var(--b);background:#eef5ff;box-shadow:0 0 0 3px rgba(37,99,235,.07)}.letter{flex:0 0 30px;height:30px;border-radius:9px;background:#eff3f8;display:grid;place-items:center;font-weight:900;color:#53627a}.answer.sel .letter{background:var(--b);color:white}.actions{display:flex;justify-content:flex-end;margin-top:24px}.result{text-align:center}.score{width:145px;height:145px;margin:4px auto 18px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--b) var(--p),#e8eef7 0);position:relative}.score:after{content:"";position:absolute;inset:12px;background:white;border-radius:50%}.score strong{position:relative;z-index:1;font-size:34px}.score small{display:block;font-size:13px;color:var(--muted);margin-top:2px}.result h2{font-size:30px;margin-bottom:7px}.sub{color:var(--muted);line-height:1.5;max-width:520px;margin:0 auto 20px}.resultBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.review{text-align:left;border-top:1px solid var(--line);margin-top:28px;padding-top:24px}.review h3{font-size:22px}.item{border:1px solid var(--line);border-radius:15px;padding:16px;margin:11px 0}.item.ok{border-left:5px solid #22a35a}.item.bad{border-left:5px solid #e2534a}.rq{font-weight:850;line-height:1.4}.label{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-top:10px}.value{margin-top:3px;line-height:1.45}.green{color:var(--ok);font-weight:800}.red{color:var(--bad);font-weight:800}.explain{background:#f6f8fc;border-radius:11px;padding:11px;margin-top:12px;color:#47556b;line-height:1.5}footer{text-align:center;color:#8d97a9;font-size:13px;margin-top:18px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,25px);opacity:0;background:#172033;color:#fff;padding:11px 14px;border-radius:12px;font-weight:750;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:560px){.wrap{width:calc(100% - 16px);padding-top:12px}.card{padding:20px 16px;border-radius:20px}.lead{font-size:16px}.actions .btn,.resultBtns .btn{width:100%}.resultBtns{display:grid}.score{width:130px;height:130px}}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">📚 Онлайн-тренажёр для 5 класса</div>
<section class="card" id="start">
<h1>География, 5 класс — § 1</h1>
<p class="lead">Проверь, как ты понял тему «Зачем нам география и как мы будем её изучать».</p>
<div class="chips"><span class="chip">10 вопросов</span><span class="chip">≈ 5 минут</span><span class="chip">Без регистрации</span><span class="chip">Разбор ошибок</span></div>
<button class="btn primary" id="startBtn">Начать тест</button>
</section>
<section class="card hidden" id="quiz">
<div class="meta"><span id="counter"></span><span id="answered"></span></div><div class="progress"><div class="bar" id="bar"></div></div>
<h2 class="question" id="question"></h2><div class="answers" id="answers"></div><div class="actions"><button class="btn primary" id="nextBtn" disabled>Далее</button></div>
</section>
<section class="card hidden result" id="result">
<div class="score" id="score"><strong id="scoreText"></strong></div><h2 id="resultTitle"></h2><p class="sub" id="resultSub"></p>
<div class="resultBtns"><button class="btn primary" id="retryBtn">Пройти ещё раз</button><button class="btn secondary" id="shareBtn">Поделиться результатом</button></div>
<div class="review"><h3>Разбор ответов</h3><div id="review"></div></div>
</section>
<footer>Учебный тест для повторения темы. 5 класс.</footer>
</main><div class="toast" id="toast"></div>
<script>
const base=[
{q:'Как первоначально переводится слово «география» с греческого?',o:['Землеописание','Измерение Земли','Путешествие по Земле','Карта Земли'],c:'Землеописание',e:'«Ге» — Земля, «графо» — пишу, описываю, поэтому первоначальное значение — «землеописание».'},
{q:'Что изучает география?',o:['Географические объекты, явления и процессы','Только природные объекты Земли','Только население и хозяйство стран','Только географические карты'],c:'Географические объекты, явления и процессы',e:'География изучает географические объекты, явления и процессы.'},
{q:'Какой пример является географическим объектом?',o:['Гора','Дождь','Землетрясение','Длительное разрушение горных пород'],c:'Гора',e:'Гора — относительно устойчивый природный объект земной поверхности.'},
{q:'Какой пример относится к географическому явлению?',o:['Наводнение','Равнина','Дорога','Длительное разрушение горных пород'],c:'Наводнение',e:'Наводнение — наблюдаемое событие, поэтому относится к географическим явлениям.'},
{q:'Что лучше всего характеризует географический процесс?',o:['Длительная последовательность изменений и преобразований','Устойчивый элемент земной поверхности','Краткое наблюдаемое событие','Способ изображения территории на карте'],c:'Длительная последовательность изменений и преобразований',e:'Географический процесс развивается во времени и представляет последовательность изменений.'},
{q:'Какой ряд содержит пять основных задач современной географии?',o:['Описание, объяснение, прогноз, проектирование, управление','Наблюдение, измерение, чтение, вычисление, рисование','Климатология, гидрология, картография, геоморфология, гляциология','Море, гора, город, река, дорога'],c:'Описание, объяснение, прогноз, проектирование, управление',e:'Пять задач современной географии — описание, объяснение, прогноз, проектирование и управление.'},
{q:'Что преимущественно изучает физическая география?',o:['Природу Земли, её компоненты и природные комплексы','Население, общество и хозяйственную деятельность','Создание и использование географических карт','Только ледники и другие льды'],c:'Природу Земли, её компоненты и природные комплексы',e:'Физическая география изучает природу Земли, её компоненты и природные комплексы.'},
{q:'Какая географическая наука занимается созданием и использованием карт?',o:['Картография','Гидрология','Климатология','Геоморфология'],c:'Картография',e:'Картография связана с созданием, изучением и использованием географических карт.'},
{q:'Что рекомендуется сделать после того, как параграф прочитан?',o:['Ответить на вопросы и задания, затем повторить главное','Сразу переходить к следующему параграфу','Выучить каждое предложение параграфа дословно','Просмотреть только фотографии и закрыть учебник'],c:'Ответить на вопросы и задания, затем повторить главное',e:'После чтения важно проверить понимание: ответить на вопросы, выполнить задания и повторить главное.'},
{q:'Какой ряд содержит именно методы географической науки?',o:['Сравнительно-описательный, картографический, экспедиционный','Описание, объяснение, прогноз','Климатология, гидрология, гляциология','Горы, моря, города'],c:'Сравнительно-описательный, картографический, экспедиционный',e:'Сравнительно-описательный, картографический и экспедиционный — методы географического исследования.'}
];
const $=id=>document.getElementById(id),shuffle=a=>{let b=[...a];for(let i=b.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b},esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let qs=[],idx=0,ans=[];
function begin(){qs=base.map(x=>({...x,choices:shuffle(x.o)}));idx=0;ans=Array(qs.length).fill(null);$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();scrollTo(0,0)}
function render(){let q=qs[idx];$('counter').textContent=`Вопрос ${idx+1} из ${qs.length}`;$('answered').textContent=`${ans.filter(Boolean).length}/${qs.length} отвечено`;$('bar').style.width=`${(idx+1)/qs.length*100}%`;$('question').textContent=q.q;$('answers').innerHTML='';['A','B','C','D'].forEach((L,i)=>{let b=document.createElement('button');b.className='answer'+(ans[idx]===q.choices[i]?' sel':'');b.innerHTML=`<span class="letter">${L}</span><span>${esc(q.choices[i])}</span>`;b.onclick=()=>{ans[idx]=q.choices[i];render()};$('answers').appendChild(b)});$('nextBtn').disabled=!ans[idx];$('nextBtn').textContent=idx===qs.length-1?'Завершить тест':'Далее'}
function finish(){let n=qs.reduce((s,q,i)=>s+(ans[i]===q.c),0),p=n*10;$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').style.setProperty('--p',p+'%');$('scoreText').innerHTML=`${n}/10<small>${p}%</small>`;let t,s;if(n>=9){t='Отлично! 🌟';s='Тема усвоена очень хорошо. Можно смело двигаться дальше.'}else if(n>=7){t='Хорошо! 👍';s='Почти всё получилось. Посмотри разбор ошибок и повтори сложные места.'}else if(n>=5){t='Нужно немного повторить 📘';s='База уже есть. Разбери ошибки и попробуй ещё раз.'}else{t='Повтори тему и попробуй ещё раз 💪';s='Повтори основные термины и пять задач географии, затем пройди тест заново.'}$('resultTitle').textContent=t;$('resultSub').textContent=s;$('result').dataset.score=n;$('result').dataset.pct=p;$('review').innerHTML=qs.map((q,i)=>{let ok=ans[i]===q.c;return `<div class="item ${ok?'ok':'bad'}"><div class="rq">${i+1}. ${esc(q.q)}</div><div class="label">Твой ответ</div><div class="value ${ok?'green':'red'}">${esc(ans[i])}</div>${ok?'':`<div class="label">Правильный ответ</div><div class="value green">${esc(q.c)}</div>`}<div class="explain">${esc(q.e)}</div></div>`}).join('');scrollTo(0,0)}
$('startBtn').onclick=begin;$('retryBtn').onclick=begin;$('nextBtn').onclick=()=>{if(!ans[idx])return;if(idx<qs.length-1){idx++;render();scrollTo(0,0)}else finish()};$('shareBtn').onclick=async()=>{let text=`География, 5 класс — § 1: мой результат ${$('result').dataset.score}/10 (${$('result').dataset.pct}%). Попробуй пройти тест:`;try{if(navigator.share)await navigator.share({title:'География, 5 класс — § 1',text,url:location.href});else{await navigator.clipboard.writeText(text+' '+location.href);toast('Результат и ссылка скопированы')}}catch(e){if(e.name!=='AbortError')toast('Скопируй ссылку из адресной строки')}};function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
</script>
</body></html>
